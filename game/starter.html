<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaxy Defender | Coding Workshop</title>
  <style>
    :root { color-scheme: dark; --ink:#eaf6ff; --muted:#9fb7d2; --accent:#5fffe0; --pink:#ff6c9b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(ellipse at 50% -20%, #183154, #090f20 60%, #050914);
      font: 16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); }
    .shell { width:min(94vw, 860px); padding:24px 0 36px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:15px; padding:0 3px 14px; }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:0.24em; font-size:11px; font-weight:800; }
    h1 { margin:4px 0 0; font-size:clamp(28px, 4vw, 41px); letter-spacing:-0.06em; }
    .pill { border:1px solid #365073; padding:8px 14px; border-radius:99px; color:var(--muted); font-size:12px; }
    .hud { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
    .stat { flex:1; min-width:110px; padding:10px 16px; background:#111d36; border:1px solid #263856; border-radius:12px; }
    .stat small { display:block; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; font-size:10px; }
    .stat strong { font-size:22px; font-variant-numeric:tabular-nums; }
    .gamebox { background:#071024; border:1px solid #35506e; border-radius:15px; overflow:hidden; box-shadow:0 20px 65px #0008; }
    canvas { width:100%; height:auto; display:block; touch-action:manipulation; }
    .tools { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:13px; flex-wrap:wrap; }
    .tools p { color:var(--muted); font-size:13px; margin:0; }
    kbd { border:1px solid #4a6281; background:#182642; padding:3px 6px; border-radius:5px; color:white; font:inherit; font-size:12px; }
    button { cursor:pointer; border:0; background:var(--accent); color:#052024; font-size:13px; font-weight:800; border-radius:9px; padding:11px 19px; }
    button:hover { filter:brightness(1.1); }
    footer { margin-top:20px; text-align:center; color:#607998; font-size:11px; letter-spacing:.08em; }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="eyebrow">VS Code + AI workshop</div><h1>GALAXY DEFENDER<span style="color:#5fffe0">_</span></h1></div>
    <div class="pill">100% local browser game</div>
  </header>
  <div class="hud">
    <div class="stat"><small>Score</small><strong id="score">0</strong></div>
    <div class="stat"><small>Lives</small><strong id="lives">3</strong></div>
    <div class="stat"><small>Wave</small><strong id="wave">1</strong></div>
  </div>
  <div class="gamebox"><canvas id="game" width="800" height="500" aria-label="Arcade shooter game"></canvas></div>
  <div class="tools">
    <p>Move <kbd>Left</kbd> <kbd>Right</kbd> or <kbd>A</kbd> <kbd>D</kbd> &nbsp; Shoot <kbd>Space</kbd></p>
    <button id="restart" type="button">Restart game</button>
  </div>
  <footer>Small scope. Fast feedback. Make it better with AI.</footer>
</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const livesEl = document.getElementById("lives");
  const waveEl = document.getElementById("wave");
  const keys = new Set();
  const W = canvas.width, H = canvas.height;
  const stars = Array.from({length:80}, (_, i) => ({ x:(i * 197 + 43) % W, y:(i * 103 + 19) % H, r:i % 4 === 0 ? 2 : 1 }));
  let ship, bullets, invaders, enemyShots, score, lives, wave, direction, shotCooldown, enemyCooldown, finished, won;
  let previous = performance.now();

  function reset() {
    ship = {x:W/2, y:H-50, w:42, h:22, speed:330};
    bullets = []; enemyShots = []; score = 0; lives = 3; wave = 1;
    direction = 1; shotCooldown = 0; enemyCooldown = 1.15;
    finished = false; won = false; spawnWave(); updateHud();
  }
  function spawnWave() {
    invaders = [];
    for (let r=0; r<3; r++) for (let c=0; c<8; c++) {
      invaders.push({ x:118+c*75, y:70+r*48, w:33, h:22, alive:true, kind:r });
    }
  }
  function updateHud() {
    scoreEl.textContent = score; livesEl.textContent = lives; waveEl.textContent = wave;
  }
  function collides(a,b) {
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }
  function loseLife() {
    lives--; updateHud();
    if (lives<=0) { finished=true; won=false; }
  }
  window.addEventListener("keydown", e => {
    if (["Space","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
    keys.add(e.code);
  });
  window.addEventListener("keyup", e => keys.delete(e.code));
  window.addEventListener("blur", () => keys.clear());
  document.getElementById("restart").addEventListener("click", reset);

  function update(dt) {
    if (finished) return;
    if (keys.has("ArrowLeft") || keys.has("KeyA")) ship.x -= ship.speed*dt;
    if (keys.has("ArrowRight") || keys.has("KeyD")) ship.x += ship.speed*dt;
    ship.x = Math.max(12, Math.min(W-ship.w-12, ship.x));
    shotCooldown -= dt; enemyCooldown -= dt;
    if (keys.has("Space") && shotCooldown <= 0) {
      bullets.push({x:ship.x + ship.w/2-2, y:ship.y-7, w:4, h:13});
      shotCooldown = 0.22;
    }
    for (const b of bullets) b.y -= 510*dt;
    bullets = bullets.filter(b => b.y > -20);
    for (const b of enemyShots) b.y += (175 + wave*20)*dt;
    enemyShots = enemyShots.filter(b => b.y < H+20);
    const living = invaders.filter(v => v.alive);
    let bounce = living.some(v => v.x < 20 || v.x+v.w > W-20);
    if (bounce) { direction *= -1; living.forEach(v => { v.y += 17; v.x += direction * 4; }); }
    for (const v of living) v.x += direction*(27+wave*10)*dt;
    if (enemyCooldown <= 0 && living.length) {
      const shooter = living[Math.floor(Math.random()*living.length)];
      enemyShots.push({x:shooter.x+shooter.w/2, y:shooter.y+shooter.h, w:5,h:13});
      enemyCooldown = Math.max(0.45, 1.3-wave*0.09);
    }
    for (const b of bullets) for (const v of living) {
      if (v.alive && collides(b,v)) { v.alive=false; b.y=-50; score+=10; updateHud(); break; }
    }
    for (const b of enemyShots) {
      if (collides(b,ship)) { b.y=H+50; loseLife(); }
    }
    if (living.some(v => v.alive && v.y+v.h >= ship.y)) { finished=true; won=false; }
    if (!invaders.some(v=>v.alive)) {
      wave++; updateHud();
      if (wave>3) { finished=true; won=true; }
      else { spawnWave(); direction=1; bullets=[]; enemyShots=[]; }
    }
  }
  function roundedRect(x,y,w,h,r,color) {
    ctx.fillStyle=color; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#071124"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#45647e";
    stars.forEach(s => {ctx.globalAlpha=s.r===2?.9:.35;ctx.fillRect(s.x,s.y,s.r,s.r);}); ctx.globalAlpha=1;
    ctx.strokeStyle="#194067";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,H-22);ctx.lineTo(W,H-22);ctx.stroke();
    roundedRect(ship.x,ship.y+8,ship.w,ship.h-8,5,"#5fffe0");
    roundedRect(ship.x+ship.w/2-7,ship.y,14,18,4,"#b0fff2");
    for (const v of invaders) if (v.alive) {
      roundedRect(v.x,v.y,v.w,v.h,6,["#ff6c9b","#ffc567","#9baaff"][v.kind]);
      ctx.fillStyle="#08142a";
      ctx.fillRect(v.x+7,v.y+8,5,5);ctx.fillRect(v.x+21,v.y+8,5,5);
    }
    ctx.fillStyle="#a5fff0"; bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
    ctx.fillStyle="#ff8c76"; enemyShots.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
    if (finished) {
      ctx.fillStyle="#071024e3";ctx.fillRect(0,0,W,H);
      ctx.textAlign="center";ctx.fillStyle=won?"#5fffe0":"#ff6c9b";
      ctx.font="800 48px system-ui";ctx.fillText(won?"YOU WIN!":"GAME OVER",W/2,H/2-12);
      ctx.fillStyle="#eaf6ff";ctx.font="18px system-ui";
      ctx.fillText("Click Restart game to play again",W/2,H/2+30);
    }
  }
  function frame(now) {
    const dt = Math.min((now-previous)/1000, 0.035); previous=now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  reset(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
